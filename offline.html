<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Memory</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div style="height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;">
    <div>
      <div style="font-size:40px; margin-bottom:12px;">📴</div>
      <h2>You're offline</h2>
      <p style="color:var(--text-secondary); max-width:320px; margin:0 auto 16px;">
        This page hasn't been cached yet. Reconnect once to load the app, then it will keep working offline.
      </p>
      <button class="btn primary" onclick="location.reload()">Retry</button>
    </div>
  </div>
</body>
</html>
