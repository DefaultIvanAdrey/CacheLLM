<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Memory — On-Device AI Kanban</title>
<meta name="description" content="A mobile-native, fully offline PWA that runs an LLM in your browser via WebLLM, with a spreadsheet-formula-capable Kanban memory board." />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#fafaf9" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Memory" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="icons/icon-192.png" alt="" />
      <span>Memory</span>
    </div>

    <button class="nav-item active" data-route="chat" type="button">
      <span class="icon-box icon-20" data-icon="chat"></span>
      <span>Chat</span>
    </button>
    <button class="nav-item" data-route="board" type="button">
      <span class="icon-box icon-20" data-icon="columns"></span>
      <span>Memory Board</span>
    </button>
    <button class="nav-item" data-route="settings" type="button">
      <span class="icon-box icon-20" data-icon="gear"></span>
      <span>Settings</span>
    </button>

    <div class="sidebar-footer">
      <div class="sidebar-status" id="sidebarStatus">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Checking device…</span>
      </div>
      <div style="padding:2px 10px;">On-device · offline-capable · your data never leaves this device.</div>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <header class="topbar">
    <div class="topbar-left">
      <button class="btn icon menu-btn" id="menuBtn" type="button" aria-label="Menu">
        <span class="icon-box icon-20" data-icon="menu"></span>
      </button>
      <div class="brand">
        <span class="view-title" id="viewTitle">Chat</span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="btn icon theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
    </div>
  </header>

  <main class="view" id="mainView"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tabbar-item active" data-route="chat" type="button">
      <span class="icon-box icon-20" data-icon="chat"></span>
      <span>Chat</span>
    </button>
    <button class="tabbar-item" data-route="board" type="button">
      <span class="icon-box icon-20" data-icon="columns"></span>
      <span>Board</span>
    </button>
    <button class="tabbar-item" data-route="settings" type="button">
      <span class="icon-box icon-20" data-icon="gear"></span>
      <span>Settings</span>
    </button>
  </nav>

</div>

<div class="toast-stack" id="toastStack"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
